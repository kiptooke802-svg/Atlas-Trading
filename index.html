<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">

<title>ATLAS TRADE | Cryptocurrency Markets</title>

<meta name="description"
content="Explore cryptocurrency markets, monitor live prices and manage your trading account.">

<style>
:root {
  --bg: #080d18;
  --panel: #111a2b;
  --panel2: #172239;
  --border: #26344c;
  --text: #f1f5ff;
  --muted: #91a1ba;
  --blue: #6285ff;
  --green: #22c990;
  --red: #ff657c;
  --gold: #f4c56b;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.5;
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: min(1180px, 94%);
  margin: auto;
}

header {
  background: rgba(8,13,24,.97);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  min-height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 12px 0;
}

.logo {
  font-size: 23px;
  font-weight: 900;
  letter-spacing: 1px;
}

.logo span {
  color: var(--gold);
}

.navlinks {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 14px;
}

.navlinks a:hover {
  color: white;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px 15px;
  background: var(--panel2);
  color: white;
  font-weight: 700;
}

.btn.primary {
  background: var(--blue);
  border-color: var(--blue);
}

.btn:hover {
  filter: brightness(1.12);
}

.hero {
  padding: 58px 0 34px;
}

.eyebrow {
  text-transform: uppercase;
  color: var(--gold);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
}

h1 {
  font-size: clamp(34px, 6vw, 58px);
  line-height: 1.1;
  margin: 14px 0;
  letter-spacing: -1.5px;
}

.hero p {
  color: var(--muted);
  max-width: 620px;
  font-size: 16px;
}

.hero-buttons {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 24px;
}

.notice {
  padding: 13px 15px;
  border: 1px solid #39486b;
  background: #111a2b;
  color: #c9d6f0;
  border-radius: 10px;
  margin: 16px 0;
  font-size: 13px;
}

.notice strong {
  color: var(--gold);
}

.section {
  margin: 32px 0;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 18px;
}

h2 {
  font-size: 24px;
  margin: 0;
}

h3 {
  margin: 0 0 12px;
}

.sub {
  color: var(--muted);
  font-size: 13px;
  margin-top: 5px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 15px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 19px;
  min-width: 0;
}

.coin-top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.coin-icon {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--panel2);
  font-weight: 800;
  font-size: 19px;
}

.coin-name {
  font-weight: 800;
}

.symbol {
  color: var(--muted);
  font-size: 12px;
}

.price {
  font-size: 25px;
  font-weight: 800;
  margin-top: 22px;
  overflow-wrap: anywhere;
}

.change {
  font-size: 13px;
  margin-top: 4px;
}

.positive {
  color: var(--green);
}

.negative {
  color: var(--red);
}

.muted {
  color: var(--muted);
}

.status {
  font-size: 12px;
  color: var(--muted);
  margin-top: 12px;
}

.status.ok {
  color: var(--green);
}

.status.error {
  color: var(--red);
}

.market-controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  width: 100%;
  margin-bottom: 15px;
}

input, select {
  width: 100%;
  min-width: 0;
  background: #0b1220;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 12px;
  outline: none;
}

input:focus, select:focus {
  border-color: var(--blue);
}

.search {
  flex: 1;
  min-width: 160px;
}

.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 12px;
}

table {
  width: 100
